const p=parse(await xl(buf));if(!p.all.length)throw new Error('مالقيتش بيانات — اتأكد إنه ملف اليومية');
FL[k]={name:fl.name,p};$(sel).textContent=fl.name+' · '+p.all.length+' صف'+(p.mo!=null?' · '+MS[p.mo]+' '+p.yr:'');
tk('⏳ جاري تحليل البيانات…');await sleep(80);const ws=rebuild();tk('✔ تمت قراءة ملف '+lb+' · '+CL.length+' عميل عليهم باقي'+(ws.length?' — '+ws[0]:''),ws.length?'er':'ok')}
catch(er){FL[k]=null;$(sel).textContent='❌ '+er.message;tk('✖ '+er.message,'er');try{rebuild()}catch(_){}}}

})(__mount("unp"));
</script>
</body>
