<div id="lg"><div class="bx"><h2>تسجيل الدخول</h2><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password"><button class="p" id="go" style="width:100%">دخول</button><div class="er" id="er"></div></div></div>

<script>firebase.initializeApp({apiKey:"AIzaSyCz6VcPP6aZylkHXvfo5Ki7HylP-wzmPPc",authDomain:"clinic-34338.firebaseapp.com",projectId:"clinic-34338",storageBucket:"clinic-34338.firebasestorage.app",messagingSenderId:"512496343367",appId:"1:512496343367:web:9fd163f55220ece587d462"});</script>

<script>
const A=firebase.auth(),D=firebase.firestore(),$=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let R='',DID='',dv='',DOCS=[],AP=[],APR=[],AL=[],PT=[],ST=[],tab='s',day=td(),un=[],grp='';
const fa=()=>{AP=APR.filter(x=>{const p=PT.find(q=>q.id==x.pid);return !(p&&p.state=='waiting')})};const SH={long:[10,22],m:[10,17],f:[10,16]},RN={manager:'مدير',doctor:'طبيب',secretary:'سكرتارية'},SN={booked:'محجوز',arrived:'في الاستقبال',in:'في الجلسة',done:'انتهت',absent:'غياب',excused:'اعتذار'};
const wa=(p,m)=>{if(!window.open('https://wa.me/'+String(p||'').replace(/\D/g,'').replace(/^0/,'20')+'?text='+encodeURIComponent(m)))toast('المتصفح منع فتح واتساب، استخدم زرار واتساب من كارت المريض')};
const staff=()=>R=='manager'||R=='secretary';
$('#go').onclick=()=>{$('#er').textContent='';A.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>$('#er').textContent='الإيميل أو الباسورد غلط')};
$('#lo').onclick=()=>ask('تسجيل الخروج؟').then(o=>o&&A.signOut());
A.onAuthStateChanged(async u=>{un.forEach(f=>f());un=[];
 if(!u){$('#lg').hidden=false;$('#lo').hidden=true;$('#ap').innerHTML='';return}
 try{const s=await D.doc('staff/'+u.email.toLowerCase()).get();if(!s.exists)throw 0;R=s.data().role;DID=s.data().doctorId||''}catch(e){$('#er').textContent='الحساب غير مفعّل، كلّم المدير';A.signOut();return}
 $('#lg').hidden=true;$('#lo').hidden=false;$('#ti').textContent='جدول العيادة · '+RN[R];tab='s';sub()});
function sub(){un.forEach(f=>f());un=[];const C=n=>D.collection(n);
 un.push(C('doctors').onSnapshot(s=>{DOCS=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{}));
 let q=C('appts').where('date','==',day);if(R=='doctor')q=q.where('doctorId','==',DID);
 un.push(q.onSnapshot(s=>{APR=s.docs.map(d=>({id:d.id,...d.data()}));fa();draw()},()=>{}));
 if(staff())un.push(C('pats').onSnapshot(s=>{PT=s.docs.map(d=>({id:d.id,...d.data()}));fa();draw()},()=>{}));
 if(R=='manager')un.push(C('appts').onSnapshot(s=>{AL=s.docs.map(d=>({id:d.id,...d.data()}));if(tab=='r')draw()},()=>{}),C('staff').onSnapshot(s=>{ST=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{}))}
function draw(force){const ae=document.activeElement;if(!R||(!force&&ae&&$('#ap').contains(ae)&&/INPUT|SELECT/.test(ae.tagName)))return;
 const t=[['s','الجدول']];if(staff())t.push(['p','المرضى']);if(R=='manager')t.push(['m','الأطباء والموظفين'],['r','التقارير']);
 $('#nv').innerHTML=t.map(x=>`<button data-t="${x[0]}" class="${tab==x[0]?'on':''}">${x[1]}</button>`).join('');
 $('#ap').innerHTML=({s:vS,p:vP,m:vM,r:vR})[tab]()}
const opt=(a,f)=>a.map(f).join('');
const SX={m:'Male · رجال',f:'Female · سيدات'};
const MSG={1:'السلام عليكم ورحمة الله\nأهلاً بحضرتك، معك ألفا كير للعلاج الطبيعي.\n\nنحيطكم علماً بأنه تم تسجيل عدم حضور حضرتك لموعد الجلسة، وبذلك تم استنفاذ الاعتذار المسموح به.\nنرجو الالتزام بمواعيد الجلسات القادمة، وفي حال تكرار الغياب سيتم إلغاء المواعيد أوتوماتيكياً عن طريق السيستم، ويلزم التواصل معنا لتحديد مواعيد جديدة.\n\nنتمنى لحضرتك دوام الصحة، ونحن في خدمتكم دائماً.',
2:'السلام عليكم ورحمة الله\nأهلاً بحضرتك، معك ألفا كير للعلاج الطبيعي.\n\nنظراً لظروف حضرتك وعدم الحضور، تم إلغاء المواعيد أوتوماتيكياً عن طريق السيستم.\nبرجاء التواصل معنا في أقرب وقت لتحديد مواعيد جديدة مناسبة لحضرتك لاستكمال باقي جلسات العلاج.\n\nنحن في خدمتكم دائماً.'};
const DN=['أحد','اتنين','تلات','أربع','خميس','جمعة','سبت'];
const gen=(s,days,n)=>{const[y,m,dd]=s.split('-').map(Number),c=new Date(y,m-1,dd),o=[];for(let k=0;k<900&&o.length<n;k++,c.setDate(c.getDate()+1))if(days.includes(c.getDay()))o.push(c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0'));return o};
const GR={a:[0,2,4],b:[1,3,6]},GL={a:'أحد · تلات · خميس',b:'سبت · اتنين · أربعاء'};
const wd=s=>{const[y,m,x]=s.split('-').map(Number);return new Date(y,m-1,x).getDay()};
const fd=c=>c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
const nx=(s,dd,k)=>{const[y,m,x]=s.split('-').map(Number),c=new Date(y,m-1,x);for(let i=0;i<8;i++){c.setDate(c.getDate()+k);if(dd.includes(c.getDay()))return fd(c)}return s};
const works=(d,s)=>!d.days||!d.days.length||d.days.includes(wd(s));
const bal=(p,a)=>{const cu=a.filter(x=>['done','arrived','in'].includes(x.status)).length,u=p.used==null?cu:p.used,bk=a.filter(x=>x.status=='booked'&&x.date>=td()).length,t=p.total||0;return{t,u,bk,av:Math.max(0,t-u-bk)}};
const gk=d=>{const j=JSON.stringify([...(d.days||[])].sort());return j==JSON.stringify(GR.a)?'a':j==JSON.stringify(GR.b)?'b':''};
const dlb=a=>{if(!a||!a.length)return '';const j=JSON.stringify([...a].sort());return j==JSON.stringify(GR.a)?GL.a:j==JSON.stringify(GR.b)?GL.b:a.map(i=>DN[i]).join(' · ')};
const dayBox=sel=>`<div class="row"><button data-a="pa">أحد · تلات · خميس</button><button data-a="pb">سبت · اتنين · أربعاء</button></div><div class="days">${DN.map((n,i)=>`<label><input type="checkbox" class="dk" value="${i}"${sel&&sel.includes(i)?' checked':''}>${n}</label>`).join('')}</div>`;
const dget=()=>[...document.querySelectorAll('#md .dk:checked')].map(x=>+x.value);
const tick=a=>document.querySelectorAll('#md .dk').forEach(c=>c.checked=a.includes(+c.value));
const hr=h=>{h=((+h%24)+24)%24;return (h%12||12)+' '+(h<12?'ص':'م')};
const fm=t=>{if(!t)return '';const[h,m]=t.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'ص':'م')};
const hsel=(id,val,ph)=>`<select id="${id}">${ph?`<option value="">${ph}</option>`:''}${Array.from({length:25},(_,h)=>`<option value="${h}"${h==val?' selected':''}>${hr(h)}${h==0?' (بداية اليوم)':h==24?' (نهاية اليوم)':''}</option>`).join('')}</select>`;
const tsel=(id,val,ph)=>{const lo=DOCS.length?Math.min(...DOCS.map(d=>+d.from)):10,hi=DOCS.length?Math.max(...DOCS.map(d=>+d.to)):22;let o=`<option value="">${ph}</option>`;for(let m=lo*60;m<hi*60;m+=30){const t=String(m/60|0).padStart(2,'0')+':'+(m%60?'30':'00');o+=`<option value="${t}"${t==val?' selected':''}>${fm(t)}</option>`}return `<select id="${id}">${o}</select>`};
const dsel=(id,val,ph,sx)=>`<select id="${id}"><option value="">${ph}</option>${opt(DOCS.filter(d=>!sx||d.sex==sx),d=>`<option value="${d.id}"${d.id==val?' selected':''}>${E(d.name)} · ${d.sex=='f'?'Female':'Male'}</option>`)}</select>`;
const wi=p=>p.state=='waiting'?`<div><small class="wtx">⏳ ${p.wTime?'مستني ميعاد '+fm(p.wTime):'بدون ميعاد محدد'}${p.days&&p.days.length?' · '+dlb(p.days):''}${p.wDoc?' · '+E((DOCS.find(d=>d.id==p.wDoc)||{}).name||''):''}</small></div>`:'';
const wlist=d=>{if(!staff())return '';const w=PT.filter(p=>p.state=='waiting'&&p.sex==d.sex&&(!p.wDoc||p.wDoc==d.id)).sort((a,b)=>(a.wTime||'99')>(b.wTime||'99')?1:-1);return `<div class="card"><b>⏳ قائمة الانتظار · ${d.sex=='f'?'Female':'Male'}</b>${w.length?w.map(p=>`<div class="ap"><b>${E(p.name)}</b> <small class="wtx">${p.wTime?'مستني '+fm(p.wTime):'بدون ميعاد محدد'}</small></div>`).join(''):'<br><small>لا يوجد</small>'}</div>`};
const wq=(d,t)=>staff()?PT.filter(p=>p.state=='waiting'&&p.sex==d.sex&&p.wTime==t&&(!p.wDoc||p.wDoc==d.id)).map(p=>`<div class="row"><small class="wtx">⏳ ${E(p.name)} مستني الميعاد ده</small><button class="p" data-a="bkw" data-i="${t}|${p.id}">حجز له</button></div>`).join(''):'';
const tag0=(a)=>{const n=a.filter(x=>x.drMark&&((x.drMark=='came'&&x.status=='booked')||(x.drMark=='no'&&['arrived','in','done'].includes(x.status)))).length;return n?`<span class="tg" style="background:var(--or)">⚠ ${n} للمراجعة</span> `:''};
const tag=(a,isT)=>{const bz=a.some(x=>x.status=='in'),w=a.filter(x=>x.status=='arrived').length;return bz?'<span class="tg bz">في جلسة</span>':w?`<span class="tg wt">${w} في الاستقبال</span>`:isT?'<span class="tg fr">متاح الآن</span>':''};

const rvOpen=(d,s)=>{if(!d||s!=td())return false;const n=new Date(),h=n.getHours()+n.getMinutes()/60;return h>=(+d.to)-2};
const DM={came:'✅ جه',no:'❌ ما جاش'};
function rvCard(d,a){const ok=['arrived','in','done'],cm=a.filter(x=>ok.includes(x.status)||x.drMark=='came').length,no=a.filter(x=>!ok.includes(x.status)&&x.drMark=='no').length,pe=a.filter(x=>!ok.includes(x.status)&&!x.drMark&&x.status!='absent'&&x.status!='excused').length;
 const rows=a.slice().sort((p,q)=>p.time>q.time?1:-1).map(x=>{const au=ok.includes(x.status),ms=x.status=='absent'||x.status=='excused';
  let h=`<div class="ap"><div class="hd"><span><b>${fm(x.time)}</b> · ${E(x.pname)}</span><span class="st">${SN[x.status]||''}</span></div>`;
  if(au)h+='<small>✅ متسجل وصل (السكرتارية/الجلسة)</small>';
  else if(ms)h+=`<small>مسجّل ${SN[x.status]} من السكرتارية</small>`;
  else{h+=`<div class="row"><button class="${x.drMark=='came'?'p':''}" data-a="dm" data-i="${x.id}|came">✅ جه</button><button class="${x.drMark=='no'?'d':''}" data-a="dm" data-i="${x.id}|no">❌ ما جاش</button>${x.drMark?`<button data-a="dm" data-i="${x.id}|">تراجع</button>`:''}</div>`}
  return h+'</div>'}).join('');
 return `<div class="card" style="border:2px solid var(--or)"><b>📋 مراجعة الحضور قبل نهاية الشفت</b><p><small>علّم مين جه ومين ما جاش وراجع مع السكرتارية لو في حاجة ناقصة. علامتك بتظهر لها فوراً ومبتغيّرش الرصيد.</small></p><p>✅ جه <b>${cm}</b> · ❌ ما جاش <b>${no}</b> · ⏳ لسه ما اتعلمش <b>${pe}</b></p>${rows||'<small>لا يوجد مواعيد النهارده</small>'}</div>`}
function apRow(x){const c=isC(x);return `<div class="${c?'ct':'cs'}">${xi(x)}${rm(PT.find(p=>p.id==x.pid))}${apRow0(x)}</div>`}
function apRow0(x){const rem=x.status=='in'&&x.startedAt?Math.max(0,Math.round(x.dur-(Date.now()-x.startedAt)/6e4)):null,pt=PT.find(p=>p.id==x.pid),ex=pt?pt.excuses||0:0,k=ex>1?'red':ex==1?'am':'';
 let h=`<div class="hd"><span><span class="${k}">${E(x.pname)}</span> <small>${E(x.payer||'')}</small></span><span class="st">${SN[x.status]||''}</span></div>`;
 if(rem!=null)h+=`<small>باقي ${rem} د</small> `;if(x.drMark){const ok=['arrived','in','done'].includes(x.status),w=(x.drMark=='came'&&x.status=='booked')?' ⚠ الحالة لسه "محجوز" — راجعي وسجّلي وصل':(x.drMark=='no'&&ok)?' ⚠ متسجل وصل في السيستم — راجعي مع الدكتور':'';h+=`<div><small class="${w?'red':''}">👨‍⚕️ الدكتور: ${DM[x.drMark]}${w}</small></div>`}h+='<div class="row">';
 if(staff()&&x.status=='booked')h+=`<button class="p" data-a="arr" data-i="${x.id}">وصل</button><button data-a="exc" data-i="${x.id}">اعتذار</button><button data-a="abs" data-i="${x.id}">غياب</button>`;
 if(staff())h+=`<button data-a="mv" data-i="${x.id}">نقل للانتظار</button>`;
 if(staff()&&x.status!='done'&&x.status!='in')h+=`<button class="d" data-a="del" data-i="${x.id}">حذف</button>`;
 if(R=='doctor'&&x.status=='arrived')h+=`<button class="p" data-a="st" data-i="${x.id}">بدأ الجلسة</button>`;
 if((R=='doctor'||R=='manager')&&x.status=='in')h+=`<button class="p" data-a="fin" data-i="${x.id}">Finished</button>`;
 return h+'</div>'}
function vS(){if(R=='doctor')dv=DID;const isT=day==td(),d=DOCS.find(x=>x.id==dv),ds=DOCS.filter(x=>(R!='doctor'||x.id==DID)&&works(x,day)).sort((a,b)=>a.name>b.name?1:-1);
 let h=`<div class="card"><div class="row"><input type="date" id="dy" value="${day}"><b>${DN[wd(day)]}</b>${d&&R!='doctor'?'<button data-a="od" data-i="">← كل الأطباء</button>':''}</div>${staff()?`<div class="row" style="margin-top:8px"><button data-a="gr" data-i="a" class="${grp=='a'?'on':''}">${GL.a}</button><button data-a="gr" data-i="b" class="${grp=='b'?'on':''}">${GL.b}</button>${grp?'<button data-a="gp" data-i="-1">اليوم السابق</button><button data-a="gp" data-i="1">اليوم التالي</button>':''}</div>`:''}</div>`;
 if(d&&!works(d,day))return h+`<div class="card"><b>${E(d.name)}</b><p>مش شغال يوم ${DN[wd(day)]}.<br><small>أيامه: ${GL[gk(d)]||'كل الأيام'}</small></p></div>`;
 if(d){const a=AP.filter(x=>x.doctorId==d.id);h+=`<div class="card"><div class="hd"><b>${E(d.name)} <small>${SX[d.sex]||''} · ${hr(d.from)} – ${hr(d.to)}</small></b>${tag0(a)}${tag(a,isT)}</div>`;
  if(R=='doctor'&&rvOpen(d,day))h+=rvCard(d,a);
  for(let m=d.from*60;m<d.to*60;m+=30){const t=String(m/60|0).padStart(2,'0')+':'+(m%60?'30':'00'),xs=a.filter(y=>y.time==t);
   h+=`<div class="ap"><div class="hd"><b>${fm(t)}</b>${staff()?`<button data-a="bk" data-i="${t}">+ حجز${xs.length?' ('+xs.length+')':''}</button>`:xs.length?'':'<small>فاضي</small>'}</div>${xs.map(apRow).join('')}${wq(d,t)}</div>`}
  return h+'</div>'+wlist(d)}
 if(!ds.length)h+=`<p>${DOCS.length?'مفيش أطباء شغالين يوم '+DN[wd(day)]+'.':'لا يوجد أطباء بعد.'}</p>`;

 npw(){const n=v('#n1').trim();if(!n||!v('#n7'))return toast('اكتب الاسم واختر النوع (Male / Female)');const dd=DOCS.find(x=>x.id==v('#n6'));if(dd&&dd.sex!=v('#n7'))return toast('نوع الطبيب مختلف عن نوع المريض');D.collection('pats').add({...xg(),name:n,sex:v('#n7'),phone:v('#n2'),total:+v('#n4')||0,excuses:0,state:'waiting',time:v('#n8'),days:dget(),wTime:v('#n8'),wDoc:v('#n6')});ACT.cl()},
 sch(i){const p=PT.find(x=>x.id==i);if(!p)return;$('#md').innerHTML=`<div class="bx"><h3>الساعة وأيام ${E(p.name)}</h3>${tsel('sc1',p.time,'— بدون ساعة محددة —')}<p style="margin:10px 0 4px"><b>أيام الحضور</b></p>${dayBox(p.days)}<button class="p" data-a="sch2" data-i="${i}" style="width:100%;margin-top:10px">حفظ</button><button data-a="cl" style="width:100%;margin-top:6px">إلغاء</button></div>`;$('#md').hidden=false},
 sch2(i){D.doc('pats/'+i).update({time:v('#sc1'),days:dget()});ACT.cl()},
 sx(i){const p=PT.find(x=>x.id==i);if(!p)return;$('#md').innerHTML=`<div class="bx"><h3>نوع ${E(p.name)}</h3><select id="sx1"><option value="m"${p.sex=='m'?' selected':''}>Male · رجال</option><option value="f"${p.sex=='f'?' selected':''}>Female · سيدات</option></select><button class="p" data-a="sx2" data-i="${i}" style="width:100%;margin-top:10px">حفظ</button><button data-a="cl" style="width:100%;margin-top:6px">إلغاء</button></div>`;$('#md').hidden=false},
 sx2(i){D.doc('pats/'+i).update({sex:v('#sx1')});ACT.cl()},
 nd(){const n=v('#d1').trim(),k=v('#d3'),s=SH[k];if(!n||!v('#d2')||!v('#d6'))return toast('اكتب الاسم واختر نوع الطبيب وأيام الشغل');D.collection('doctors').add({name:n,sex:v('#d2'),days:GR[v('#d6')],shift:k,from:+v('#d4')||s[0],to:+v('#d5')||s[1]})},
 dd:i=>ask('حذف الطبيب؟').then(o=>o&&D.doc('doctors/'+i).delete()),
 ns(){const e=v('#s1').trim().toLowerCase(),r=v('#s2');if(!e)return;if(r=='doctor'&&!v('#s3'))return toast('اختر الطبيب');D.doc('staff/'+e).set({role:r,doctorId:r=='doctor'?v('#s3'):''})},
 sd:i=>ask('حذف الحساب؟').then(o=>o&&D.doc('staff/'+i).delete())};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]'),ae=document.activeElement;if(b&&ae&&/INPUT|SELECT/.test(ae.tagName)&&$('#ap').contains(ae))ae.blur();if(b){const r=ACT[b.dataset.a](b.dataset.i);setTimeout(()=>draw(true),400);return r}const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;draw()}});
document.addEventListener('change',e=>{if(e.target.id=='rdc'){window.RDOC=e.target.value;draw();return}if(e.target.id=='np'){window.NP=e.target.value;draw();return}if(e.target.id=='rd'&&e.target.value){rday=e.target.value;e.target.blur();draw()}if(e.target.id=='n12')$('#cw').hidden=e.target.value!='contract';if(e.target.id=='n13')cr();if(e.target.id=='bp')ACT.pf();if(e.target.id=='dy'&&e.target.value){e.target.blur();day=e.target.value;if(grp&&!GR[grp].includes(wd(day)))grp='';sub()}});
document.addEventListener('input',e=>{if(e.target.id=='n14')cr();if(e.target.id=='ps'){PS=e.target.value;$('#pl').innerHTML=PLR()}});
const svt=()=>{const t=[...document.querySelectorAll('#md .svr')].reduce((a,r)=>{const k=r.querySelector('.sk').value;return a+(k=='x'?+r.querySelector('.sc').value||0:+k||0)},0),n=document.getElementById('n4');if(t>0&&n)n.value=t};
document.addEventListener('change',e=>{const r=e.target.closest&&e.target.closest('.svr');if(!r)return;if(e.target.classList.contains('sn'))r.querySelector('.so').hidden=e.target.value!='أخرى';if(e.target.classList.contains('sk'))r.querySelector('.sc').hidden=e.target.value!='x';svt()});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('sc'))svt()});
document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;if(t.closest('.svx')){t.closest('.svr').remove();svt()}else if(t.closest('.sva'))document.getElementById('svl').insertAdjacentHTML('beforeend',svr())});
setInterval(draw,3e4);
</script></body></html>
